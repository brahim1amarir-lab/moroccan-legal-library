let lib='all',q='';
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const total=CAT.reduce((a,l)=>a+l.items.length,0);
$('#stats').innerHTML=`<span><b>${total}</b> نصا كاملا</span><span><b>${CAT.length}</b> مكتبات</span><span><b>${CAT.reduce((a,l)=>a+l.items.filter(i=>i.o).length,0)}</b> نصا بالتعرف الضوئي</span>`;
function tabs(){$('#tabs').innerHTML=[['all','الكل',total],...CAT.map(l=>[l.code,l.name,l.items.length])].map(([c,n,k])=>`<button type="button" data-c="${c}" aria-pressed="${lib===c}">${esc(n)}<small>${k}</small></button>`).join('')}
function norm(s){return s.replace(/[ًٌٍَُِّْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')}
function render(){const nq=norm(q.trim());let html='';let shown=0;
 for(const l of CAT){if(lib!=='all'&&lib!==l.code)continue;
  const its=l.items.filter(i=>!nq||norm(i.t).includes(nq)||(l.code+'/'+i.n).includes(nq)||i.n===nq);
  if(!its.length)continue;shown+=its.length;html+=`<section><h2>${esc(l.name)}</h2>`;let cur='';
  html+='<ul class="items">';
  for(const i of its){if(i.c!==cur){cur=i.c;html+=`</ul><h3>${esc(i.c)}</h3><ul class="items">`}
   html+=`<li><button type="button" data-k="${l.code}-${i.n}"><span class="num">${i.n}</span><span class="tt">${esc(i.t)}${i.o?'<span class="ocr">OCR</span>':''}</span><span class="meta">${i.a?i.a+' مادة':''}</span></button></li>`}
  html+='</ul></section>'}
 $('#list').innerHTML=html||'<p class="empty">لا نص يطابق البحث. جرّب رقم القانون أو كلمة من عنوانه.</p>'}
function md(t){t=t.replace(/^---[\s\S]*?\n---\n/,'');const out=[];
 for(const b of t.split(/\n{2,}/)){const s=b.trim();if(!s)continue;let m;
  if(m=s.match(/^(#{1,5}) (.*)$/))out.push(`<h${m[1].length} id="${m[1].length===5?'a-'+encodeURIComponent(m[2]):''}">${esc(m[2])}</h${m[1].length}>`);
  else if(s.startsWith('>'))out.push(`<blockquote>${esc(s.replace(/^>\s?/gm,'')).replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}</blockquote>`);
  else out.push(`<p>${esc(s).replace(/\n/g,'<br>')}</p>`)}
 return out.join('')}
let docText='';
async function open(key){const [code,n]=key.split('-');const l=CAT.find(x=>x.code===code);if(!l)return;
 $('#reader').hidden=false;$('#doc').innerHTML='<p class="empty">جار تحميل النص…</p>';$('#raw').href=`${code}/${n}.md`;$('#find').value='';
 try{const r=await fetch(`${code}/${n}.md`);if(!r.ok)throw 0;docText=await r.text();$('#doc').innerHTML=md(docText);$('#reader').scrollTop=0}
 catch(e){$('#doc').innerHTML='<p class="empty">تعذر تحميل النص. أعد المحاولة بعد لحظة.</p>'}}
function closeR(){$('#reader').hidden=true;if(location.hash)history.replaceState(null,'',location.pathname+location.search)}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lib=b.dataset.c;tabs();render()});
$('#q').addEventListener('input',e=>{q=e.target.value;render()});
$('#list').addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(!b)return;location.hash=b.dataset.k});
$('#back').addEventListener('click',closeR);
$('#find').addEventListener('change',e=>{const v=e.target.value.trim();if(!v)return;const hs=[...$('#doc').querySelectorAll('h5,p')];const nv=norm(v);const h=hs.find(x=>norm(x.textContent).includes(nv));if(h){h.scrollIntoView({block:'start'});h.innerHTML=h.innerHTML.replace(/^/,'');h.style.outline='2px solid var(--accent)';setTimeout(()=>h.style.outline='',2500)}});
function route(){const h=location.hash.slice(1);if(/^[a-z]+-\d{3}$/.test(h))open(h);else $('#reader').hidden=true}
window.addEventListener('hashchange',route);
tabs();render();route();
</script>
